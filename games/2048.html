<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b22">
  <title>2048 — Моя Одесса</title>
  <style>
    :root {
      --ink: #0b1b22; --sea: #0e4a5c; --sun: #f2c14e; --chalk: #f5f1e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body {
      background: #0b1b22; color: var(--chalk); font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px;
    }
    .top {
      width: 320px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    a.back { color: var(--sun); text-decoration: none; font-weight: 700; font-size: 14px; }
    .scores { display: flex; gap: 8px; }
    .sbox { background: rgba(255,255,255,.08); padding: 4px 10px; border-radius: 8px; text-align: center; }
    .sbox span { display: block; font-size: 10px; color: #a9bcc2; text-transform: uppercase; }
    .sbox strong { font-size: 16px; font-weight: 800; color: #fff; }
    #board {
      width: 320px; height: 320px; background: #07151b; border-radius: 12px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .cell {
      background: rgba(255,255,255,.05); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #fff; transition: background .1s, transform .1s;
    }
    .t2 { background: #0e4a5c; color: #fff; }
    .t4 { background: #13708a; color: #fff; }
    .t8 { background: #f2994a; color: #111; }
    .t16 { background: #f2c14e; color: #111; }
    .t32 { background: #eb5757; color: #fff; }
    .t64 { background: #9b51e0; color: #fff; }
    .t128 { background: #27ae60; color: #fff; font-size: 19px; }
    .t256 { background: #2f80ed; color: #fff; font-size: 19px; }
    .t512 { background: #e056fd; color: #fff; font-size: 19px; }
    .t1024 { background: #ffbe76; color: #111; font-size: 16px; }
    .t2048 { background: #f0932b; color: #111; font-size: 16px; box-shadow: 0 0 16px #f0932b; }
    .hint { margin-top: 16px; font-size: 12px; color: #a9bcc2; }
  </style>
</head>
<body>
  <div class="top">
    <a href="../games.html" class="back">← В Центр</a>
    <div class="scores">
      <div class="sbox"><span>Счет</span><strong id="sc">0</strong></div>
      <div class="sbox"><span>Лучший</span><strong id="best">0</strong></div>
    </div>
  </div>
  <div id="board"></div>
  <div class="hint">Свайпайте в любом направлении или стрелки клавиатуры</div>

  <script>
    let grid = Array(16).fill(0);
    let score = 0;
    let best = parseInt(localStorage.getItem('odesa_2048_best') || '0', 10);
    document.getElementById('best').textContent = best;

    function render(){
      const b = document.getElementById('board');
      b.innerHTML = '';
      for(let i=0; i<16; i++){
        const d = document.createElement('div');
        d.className = 'cell' + (grid[i] ? ' t' + grid[i] : '');
        d.textContent = grid[i] || '';
        b.appendChild(d);
      }
      document.getElementById('sc').textContent = score;
      if(score > best){
        best = score;
        document.getElementById('best').textContent = best;
        localStorage.setItem('odesa_2048_best', String(best));
      }
    }

    function addTile(){
      const free = [];
      for(let i=0; i<16; i++) if(!grid[i]) free.push(i);
      if(!free.length) return;
      const pos = free[Math.floor(Math.random() * free.length)];
      grid[pos] = Math.random() < 0.9 ? 2 : 4;
    }

    function slide(row){
      let arr = row.filter(x => x);
      for(let i=0; i<arr.length-1; i++){
        if(arr[i] === arr[i+1]){
          arr[i] *= 2;
          score += arr[i];
          arr.splice(i+1, 1);
        }
      }
      while(arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir){
      let moved = false;
      const old = [...grid];
      if(dir === 'left' || dir === 'right'){
        for(let r=0; r<4; r++){
          let row = [grid[r*4], grid[r*4+1], grid[r*4+2], grid[r*4+3]];
          if(dir === 'right') row.reverse();
          row = slide(row);
          if(dir === 'right') row.reverse();
          for(let c=0; c<4; c++) grid[r*4+c] = row[c];
        }
      } else {
        for(let c=0; c<4; c++){
          let col = [grid[c], grid[c+4], grid[c+8], grid[c+12]];
          if(dir === 'down') col.reverse();
          col = slide(col);
          if(dir === 'down') col.reverse();
          for(let r=0; r<4; r++) grid[r*4+c] = col[r];
        }
      }
      for(let i=0; i<16; i++) if(grid[i] !== old[i]) moved = true;
      if(moved){
        addTile();
        render();
      }
      return moved;
    }

    window.move2048 = move;

    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft') move('left');
      if(e.key === 'ArrowRight') move('right');
      if(e.key === 'ArrowUp') move('up');
      if(e.key === 'ArrowDown') move('down');
    });

    let tx = 0, ty = 0;
    window.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
    }, {passive:true});
    window.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if(Math.hypot(dx, dy) < 25) return;
      if(Math.abs(dx) > Math.abs(dy)){
        move(dx > 0 ? 'right' : 'left');
      } else {
        move(dy > 0 ? 'down' : 'up');
      }
    }, {passive:true});

    addTile(); addTile(); render();
  </script>
</body>
</html>
