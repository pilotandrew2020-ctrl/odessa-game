<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b22">
  <title>Одесская Викторина — Моя Одесса</title>
  <style>
    :root {
      --ink: #0b1b22; --sea: #0e4a5c; --sun: #f2c14e; --chalk: #f5f1e8; --muted: #a9bcc2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body {
      background: #0b1b22; color: var(--chalk); font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px;
    }
    .top {
      width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    a.back { color: var(--sun); text-decoration: none; font-weight: 700; font-size: 14px; }
    .scores { display: flex; gap: 8px; }
    .sbox { background: rgba(255,255,255,.08); padding: 4px 10px; border-radius: 8px; text-align: center; }
    .sbox span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .sbox strong { font-size: 16px; font-weight: 800; color: #fff; }
    .card {
      width: 100%; max-width: 440px; background: rgba(9, 26, 33, 0.85); border: 1.5px solid rgba(245, 241, 232, 0.16);
      border-radius: 18px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    }
    .q-num { font-size: 12px; font-weight: 700; color: var(--sun); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .q-text { font-size: 17px; font-weight: 700; line-height: 1.4; margin-bottom: 18px; min-height: 48px; }
    .answers { display: flex; flex-direction: column; gap: 10px; }
    .ans-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px;
      color: #fff; padding: 12px 14px; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;
      transition: background .12s, border-color .12s, transform .08s;
    }
    .ans-btn:active { transform: scale(.98); }
    .ans-btn.correct { background: #27ae60 !important; border-color: #2ecc71 !important; color: #fff; }
    .ans-btn.wrong { background: #c0392b !important; border-color: #e74c3c !important; color: #fff; }
    #resModal { text-align: center; display: none; }
    #resTitle { font-size: 22px; font-weight: 900; color: var(--sun); margin-bottom: 8px; }
    #resScore { font-size: 15px; margin-bottom: 20px; color: var(--muted); }
    .restart-btn {
      background: var(--sun); color: #111; border: 0; padding: 12px 24px; border-radius: 12px;
      font-size: 15px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top">
    <a href="../games.html" class="back">← В Центр</a>
    <div class="scores">
      <div class="sbox"><span>Очки</span><strong id="sc">0</strong></div>
      <div class="sbox"><span>Серия</span><strong id="streak">0</strong></div>
      <div class="sbox"><span>Рекорд</span><strong id="best">0</strong></div>
    </div>
  </div>

  <div class="card" id="qCard">
    <div class="q-num" id="qNum">Вопрос 1 из 15</div>
    <div class="q-text" id="qText">Текст вопроса...</div>
    <div class="answers" id="ansBox"></div>
  </div>

  <div class="card" id="resModal">
    <div id="resTitle">Викторина завершена!</div>
    <div id="resScore">Вы ответили правильно на 15 из 15 вопросов.</div>
    <button class="restart-btn" onclick="startQuiz()">Пройти снова</button>
  </div>

  <script>
    const QUESTIONS = [
      {
        q: "Сколько ступеней насчитывает знаменитая Потёмкинская лестница сегодня?",
        a: ["192", "200", "185", "210"],
        c: 0
      },
      {
        q: "В каком году была официально основана Одесса?",
        a: ["1794", "1789", "1804", "1812"],
        c: 0
      },
      {
        q: "В честь кого названа главная пешеходная улица Одессы — Дерибасовская?",
        a: ["Хосе де Рибаса", "Франца де Воллана", "Михаила Воронцова", "Дюка де Ришелье"],
        c: 0
      },
      {
        q: "Какой архитектор построил знаменитое здание Одесского оперного театра в 1887 году?",
        a: ["Фельнер и Гельмер", "Тома де Томон", "Александр Бернардацци", "Франческо Боффо"],
        c: 0
      },
      {
        q: "Кому установлен самый первый памятник в городе Одессе (на Приморском бульваре)?",
        a: ["Дюку де Ришелье", "Екатерине II", "Александру Пушкину", "Михаилу Воронцову"],
        c: 0
      },
      {
        q: "Как называется самый известный исторический рынок Одессы?",
        a: ["Привоз", "Новый рынок", "Староконный рынок", "Черёмушки"],
        c: 0
      },
      {
        q: "На каком море расположен город Одесса?",
        a: ["Чёрное море", "Азовское море", "Средиземное море", "Каспийское море"],
        c: 0
      },
      {
        q: "Какое мореплавательное сооружение освещает путь в Одесский залив с Карантинного мола?",
        a: ["Воронцовский маяк", "Лузановский маяк", "Одесский створ", "Ланжероновский фонарь"],
        c: 0
      },
      {
        q: "Как в Одессе называют необычный дом с оптической иллюзией одной стены в Воронцовском переулке?",
        a: ["Дом-стена (Плоский дом)", "Дом-призрак", "Дом с атлантами", "Шахский дворец"],
        c: 0
      },
      {
        q: "Какой популярный приморский курортный район Одессы известен своими пляжами, аркой и аллеей?",
        a: ["Аркадия", "Отрада", "Ланжерон", "Фонтанка"],
        c: 0
      },
      {
        q: "Какой старинный городской сад расположен прямо возле Дерибасовской улицы?",
        a: ["Городской сад", "Парк Шевченко", "Парк Горького", "Дюковский сад"],
        c: 0
      },
      {
        q: "Из какого природного камня построена большая часть исторического центра Одессы и его катакомбы?",
        a: ["Ракушечник (известняк)", "Гранит", "Базальт", "Мрамор"],
        c: 0
      },
      {
        q: "Как называется исторический район на юге Одессы с 1-й по 16-ю станции вдоль побережья?",
        a: ["Большой Фонтан", "Молдаванка", "Пересыпь", "Слободка"],
        c: 0
      },
      {
        q: "Над каким спуском расположен Тёщин мост в Одессе?",
        a: ["Военный спуск", "Польский спуск", "Деволановский спуск", "Карантинный спуск"],
        c: 0
      },
      {
        q: "Как называется скульптурная группа у входа в Одесский морской вокзал?",
        a: ["Золотое дитя", "Морячка с сыном", "Посейдон", "Чайка над волнами"],
        c: 0
      }
    ];

    let currentQ = 0;
    let score = 0;
    let streak = 0;
    let bestStreak = parseInt(localStorage.getItem('odesa_quiz_streak') || '0', 10);
    document.getElementById('best').textContent = bestStreak;
    let locked = false;

    function startQuiz(){
      currentQ = 0;
      score = 0;
      streak = 0;
      locked = false;
      document.getElementById('sc').textContent = score;
      document.getElementById('streak').textContent = streak;
      document.getElementById('qCard').style.display = 'block';
      document.getElementById('resModal').style.display = 'none';
      showQuestion();
    }

    function showQuestion(){
      locked = false;
      const q = QUESTIONS[currentQ];
      document.getElementById('qNum').textContent = `Вопрос ${currentQ + 1} из ${QUESTIONS.length}`;
      document.getElementById('qText').textContent = q.q;
      const box = document.getElementById('ansBox');
      box.innerHTML = '';

      q.a.forEach((text, idx) => {
        const btn = document.createElement('button');
        btn.className = 'ans-btn';
        btn.textContent = text;
        btn.onclick = () => selectAnswer(idx, btn);
        box.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx, btn){
      if(locked) return;
      locked = true;
      const q = QUESTIONS[currentQ];
      const isCorrect = (chosenIdx === q.c);

      if(isCorrect){
        btn.classList.add('correct');
        score += 10;
        streak++;
        if(streak > bestStreak){
          bestStreak = streak;
          localStorage.setItem('odesa_quiz_streak', String(bestStreak));
          document.getElementById('best').textContent = bestStreak;
        }
      } else {
        btn.classList.add('wrong');
        streak = 0;
        const all = document.querySelectorAll('.ans-btn');
        all[q.c].classList.add('correct');
      }

      document.getElementById('sc').textContent = score;
      document.getElementById('streak').textContent = streak;

      setTimeout(() => {
        currentQ++;
        if(currentQ < QUESTIONS.length){
          showQuestion();
        } else {
          showResults();
        }
      }, 700);
    }

    function showResults(){
      document.getElementById('qCard').style.display = 'none';
      document.getElementById('resModal').style.display = 'block';
      const rightCount = score / 10;
      document.getElementById('resScore').textContent = `Вы ответили правильно на ${rightCount} из ${QUESTIONS.length} вопросов. Набрано ${score} очков.`;
    }

    window.selectAnswerByIndex = (idx) => {
      const btns = document.querySelectorAll('.ans-btn');
      if(btns[idx]) selectAnswer(idx, btns[idx]);
    };

    startQuiz();
  </script>
</body>
</html>
