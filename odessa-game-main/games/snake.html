<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b22">
  <title>Змейка у Моря — Моя Одесса</title>
  <style>
    :root {
      --ink: #0b1b22; --sea: #0e4a5c; --sun: #f2c14e; --chalk: #f5f1e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body {
      background: #0b1b22; color: var(--chalk); font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px;
    }
    .top {
      width: 320px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    a.back { color: var(--sun); text-decoration: none; font-weight: 700; font-size: 14px; }
    .scores { display: flex; gap: 8px; }
    .sbox { background: rgba(255,255,255,.08); padding: 4px 10px; border-radius: 8px; text-align: center; }
    .sbox span { display: block; font-size: 10px; color: #a9bcc2; text-transform: uppercase; }
    .sbox strong { font-size: 16px; font-weight: 800; color: #fff; }
    #c {
      background: #07151b; border: 2px solid rgba(242, 193, 78, 0.4); border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .dpad {
      margin-top: 16px; display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 50px);
      gap: 6px; justify-content: center;
    }
    .dbtn {
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 10px;
      color: #fff; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .dbtn:active { background: var(--sun); color: #111; }
  </style>
</head>
<body>
  <div class="top">
    <a href="../games.html" class="back">← В Центр</a>
    <div class="scores">
      <div class="sbox"><span>Счет</span><strong id="sc">0</strong></div>
      <div class="sbox"><span>Лучший</span><strong id="best">0</strong></div>
    </div>
  </div>
  <canvas id="c" width="300" height="300"></canvas>
  <div class="dpad">
    <div></div>
    <div class="dbtn" id="bU">▲</div>
    <div></div>
    <div class="dbtn" id="bL">◀</div>
    <div class="dbtn" id="bD">▼</div>
    <div class="dbtn" id="bR">▶</div>
  </div>

  <script>
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const N = 15, SZ = 20;
    let snake = [{x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}];
    let dir = {x: 1, y: 0};
    let nextDir = {x: 1, y: 0};
    let food = {x: 11, y: 7};
    let score = 0;
    let best = parseInt(localStorage.getItem('odesa_snake_best') || '0', 10);
    document.getElementById('best').textContent = best;

    function placeFood(){
      while(true){
        const fx = Math.floor(Math.random() * N);
        const fy = Math.floor(Math.random() * N);
        if(!snake.some(s => s.x === fx && s.y === fy)){
          food = {x: fx, y: fy};
          break;
        }
      }
    }

    function step(){
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if(head.x < 0 || head.x >= N || head.y < 0 || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)){
        snake = [{x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}];
        dir = nextDir = {x: 1, y: 0};
        score = 0;
        document.getElementById('sc').textContent = score;
        placeFood();
        draw();
        return;
      }

      snake.unshift(head);
      if(head.x === food.x && head.y === food.y){
        score += 10;
        document.getElementById('sc').textContent = score;
        if(score > best){
          best = score;
          document.getElementById('best').textContent = best;
          localStorage.setItem('odesa_snake_best', String(best));
        }
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw(){
      ctx.fillStyle = '#07151b';
      ctx.fillRect(0, 0, 300, 300);

      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for(let x=0; x<N; x++) for(let y=0; y<N; y++) ctx.fillRect(x*SZ+9, y*SZ+9, 2, 2);

      ctx.fillStyle = '#f2c14e';
      ctx.beginPath();
      ctx.arc(food.x*SZ + SZ/2, food.y*SZ + SZ/2, SZ*0.4, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#13708a';
      for(let i=1; i<snake.length; i++){
        ctx.fillRect(snake[i].x*SZ+1, snake[i].y*SZ+1, SZ-2, SZ-2);
      }
      ctx.fillStyle = '#76d7ea';
      ctx.fillRect(snake[0].x*SZ+1, snake[0].y*SZ+1, SZ-2, SZ-2);
    }

    window.snakeStep = step;

    function setD(x, y){
      if(x !== -dir.x && y !== -dir.y) nextDir = {x, y};
    }

    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowUp') setD(0, -1);
      if(e.key === 'ArrowDown') setD(0, 1);
      if(e.key === 'ArrowLeft') setD(-1, 0);
      if(e.key === 'ArrowRight') setD(1, 0);
    });

    document.getElementById('bU').onclick = () => setD(0, -1);
    document.getElementById('bD').onclick = () => setD(0, 1);
    document.getElementById('bL').onclick = () => setD(-1, 0);
    document.getElementById('bR').onclick = () => setD(1, 0);

    let tx=0, ty=0;
    cv.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    }, {passive:true});
    cv.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if(Math.hypot(dx, dy) < 20) return;
      if(Math.abs(dx) > Math.abs(dy)) setD(dx > 0 ? 1 : -1, 0);
      else setD(0, dy > 0 ? 1 : -1);
    }, {passive:true});

    setInterval(step, 140);
    draw();
  </script>
</body>
</html>
